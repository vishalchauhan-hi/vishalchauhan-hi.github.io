# Keeps the GitHub Actions used by "Site checks" (checkout, setup-node) up to date.
# Once a month Dependabot opens a small PR if a newer version exists; merge it
# when Site checks is green.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Actions"
