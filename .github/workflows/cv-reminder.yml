# Monthly CV reminder — on the 1st of every month (09:00 Tokyo) this opens an
# issue on the repo with the update steps. Close it once the CV is updated.
# Run it by hand any time from the Actions tab ("Run workflow").
name: Monthly CV reminder

on:
  schedule:
    - cron: "0 0 1 * *"   # 00:00 UTC on the 1st = 09:00 JST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open the reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          month="$(date -u +'%B %Y')"
          title="Update CV for ${month}"
          if gh issue list --state open --search "in:title \"${title}\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Reminder already open."; exit 0
          fi
          gh issue create --title "${title}" --body "$(cat <<'BODY'
          Time for the monthly CV update.

          1. Save your latest CV as a PDF (your normal one is fine; the tool removes
             the phone number and referees from the public copy).
          2. On your Mac:
             ```bash
             cd ~/Desktop/vishalchauhan-hi-redesign
             git switch main && git pull && git switch -c cv-update
             tools/update-cv.sh ~/Downloads/02_Curriculum_Vitae.pdf
             git add -A && git commit -m "Update CV" && git push -u origin HEAD
             gh pr create --fill
             ```
          3. Merge the PR when **Site checks** is green, then close this issue.

          Nothing changed this month? Just close this issue.
          BODY
          )"
